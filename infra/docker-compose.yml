services:
  postgres:
    image: postgres:16-alpine
    container_name: bizdir_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizdir
      POSTGRES_PASSWORD: bizdir
      POSTGRES_DB: bizdir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizdir -d bizdir"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bizdir_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
